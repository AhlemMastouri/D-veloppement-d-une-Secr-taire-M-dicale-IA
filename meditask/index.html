<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MediTask – Gestion des Tâches Médicales</title>
  <meta name="description" content="Plateforme de gestion de tâches médicales avec accès par rôle : Médecin, Secrétaire, Admin, Patient."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════════════
     LOGIN PAGE
════════════════════════════════════════════════════════════════════════ -->
<div id="page-login" class="page active">
  <div class="login-bg">
    <div class="login-orb orb1"></div>
    <div class="login-orb orb2"></div>
    <div class="login-orb orb3"></div>
  </div>
  <div class="login-container">
    <div class="login-brand">
      <div class="brand-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="brand-name">MediTask</span>
    </div>
    <h1 class="login-title">Bienvenue</h1>
    <p class="login-subtitle">Connectez-vous pour accéder à votre espace</p>

    <div id="login-error" class="alert-error hidden">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><line x1="12" y1="8" x2="12" y2="12" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="16" r="1" fill="currentColor"/></svg>
      <span id="login-error-msg">Identifiants incorrects</span>
    </div>

    <form id="login-form" class="login-form">
      <div class="form-group">
        <label for="login-email">Email</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" stroke="currentColor" stroke-width="2"/><polyline points="22,6 12,13 2,6" stroke="currentColor" stroke-width="2"/></svg>
          <input type="email" id="login-email" placeholder="votre@email.com" autocomplete="email" required/>
        </div>
      </div>
      <div class="form-group">
        <label for="login-password">Mot de passe</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="currentColor" stroke-width="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="2"/></svg>
          <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required/>
          <button type="button" class="toggle-pw" onclick="togglePw()">
            <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg>
          </button>
        </div>
      </div>
      <div class="login-options">
        <label class="checkbox-label">
          <input type="checkbox" id="remember-me"/>
          <span class="checkmark"></span>
          Se souvenir de moi
        </label>
        <a href="#" class="forgot-link">Mot de passe oublié ?</a>
      </div>
      <button type="submit" class="btn-login" id="btn-login">
        <span id="btn-login-text">Se connecter</span>
        <div id="btn-login-spinner" class="spinner hidden"></div>
      </button>
    </form>

    <div class="demo-accounts">
      <p class="demo-title">Comptes démo (cliquez pour remplir)</p>
      <div class="demo-grid">
        <button class="demo-btn" data-email="admin@cabinet.fr" data-pw="admin123" data-role="ADMIN">
          <span class="demo-role-dot admin"></span>Admin
        </button>
        <button class="demo-btn" data-email="doctor@cabinet.fr" data-pw="doctor123" data-role="DOCTOR">
          <span class="demo-role-dot doctor"></span>Médecin
        </button>
        <button class="demo-btn" data-email="secretary@cabinet.fr" data-pw="secretary123" data-role="SECRETARY">
          <span class="demo-role-dot secretary"></span>Secrétaire
        </button>
        <button class="demo-btn" data-email="patient@cabinet.fr" data-pw="patient123" data-role="PATIENT">
          <span class="demo-role-dot patient"></span>Patient
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════════════
     APP SHELL (Sidebar + Content)
════════════════════════════════════════════════════════════════════════ -->
<div id="page-app" class="page">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand-icon small">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <span class="brand-name">MediTask</span>
      <button class="sidebar-toggle" onclick="toggleSidebar()" id="sidebar-toggle-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="3" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <!-- User card -->
    <div class="sidebar-user">
      <div class="avatar" id="sidebar-avatar">AD</div>
      <div class="sidebar-user-info">
        <div class="sidebar-user-name" id="sidebar-name">Utilisateur</div>
        <div class="sidebar-user-role" id="sidebar-role-badge">ADMIN</div>
      </div>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav">
      <!-- Filled dynamically per role -->
    </nav>

    <button class="btn-logout" onclick="logout()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polyline points="16 17 21 12 16 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Déconnexion</span>
    </button>
  </aside>

  <!-- Main content -->
  <main class="main-content" id="main-content">
    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-left">
        <h2 class="page-title" id="topbar-title">Dashboard</h2>
        <div class="breadcrumb" id="topbar-breadcrumb">Accueil</div>
      </div>
      <div class="topbar-right">
        <div class="search-bar">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="text" placeholder="Rechercher..." id="global-search"/>
        </div>
        <button class="notif-btn" id="notif-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2"/><path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="2"/></svg>
          <span class="notif-dot"></span>
        </button>
        <div class="topbar-avatar" id="topbar-avatar">AD</div>
      </div>
    </header>

    <!-- Dynamic view container -->
    <div class="view-container" id="view-container">
      <!-- Injected by JS -->
    </div>
  </main>
</div>

<!-- ═══════════════════════════════════════════════════════════════════════
     TASK MODAL
════════════════════════════════════════════════════════════════════════ -->
<div class="modal-overlay hidden" id="task-modal-overlay" onclick="closeTaskModal(event)">
  <div class="modal" id="task-modal">
    <div class="modal-header">
      <h3 id="modal-title">Nouvelle tâche</h3>
      <button class="modal-close" onclick="closeTaskModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Titre</label>
        <input type="text" id="task-title-input" placeholder="Titre de la tâche..." class="modal-input"/>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="task-desc-input" placeholder="Description..." class="modal-textarea" rows="3"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Priorité</label>
          <select id="task-priority-input" class="modal-select">
            <option value="low">Basse</option>
            <option value="medium" selected>Moyenne</option>
            <option value="high">Haute</option>
            <option value="urgent">Urgente</option>
          </select>
        </div>
        <div class="form-group">
          <label>Échéance</label>
          <input type="date" id="task-due-input" class="modal-input"/>
        </div>
      </div>
      <div class="form-group">
        <label>Catégorie</label>
        <select id="task-category-input" class="modal-select">
          <option value="medical">Médical</option>
          <option value="admin">Administratif</option>
          <option value="patient">Patient</option>
          <option value="urgent">Urgence</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeTaskModal()">Annuler</button>
      <button class="btn-primary" onclick="saveTask()">Enregistrer</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
